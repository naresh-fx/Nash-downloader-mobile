name: nash_downloader
description: Batch YouTube & Instagram video downloader for Android, with share-sheet support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Captures links shared into the app from Instagram / YouTube via the OS share sheet
  receive_sharing_intent: ^1.8.0

  # Local notification with progress bar while a download runs in the background
  flutter_local_notifications: ^17.2.2

  # Finds app-specific storage locations
  path_provider: ^2.1.3

  # Runtime storage permission on older Android versions
  permission_handler: ^11.3.1

  # Opens downloaded files from the History tab
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
